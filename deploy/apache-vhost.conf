# Apache vhost for parttime.q8ee.com (نظام المنتدبين)
#
# Same layout as help.q8ee.com on this server: one HTTP vhost on the
# origin IP; certbot (Let's Encrypt, apache plugin) generates the matching
# *-le-ssl.conf and the HTTPS redirect:
#
#   cp deploy/apache-vhost.conf /etc/apache2/sites-available/parttime.q8ee.com.conf
#   a2enmod rewrite proxy proxy_fcgi headers ssl
#   a2ensite parttime.q8ee.com && apache2ctl configtest && systemctl reload apache2
#   certbot --apache -d parttime.q8ee.com --redirect
#
# deploy/first-deploy.sh does all of this. The PHP-FPM socket must match
# `ls /run/php/` (php8.4-fpm.sock as of 2026-09-29). Cloudflare proxies the
# host; keep the zone SSL/TLS mode at Full (strict), as for help.q8ee.com.

<VirtualHost 74.207.252.122:80>
    ServerName   parttime.q8ee.com
    ServerAdmin  mishal@q8ee.com
    DocumentRoot /srv/www/parttime.q8ee.com/app/public

    <Directory /srv/www/parttime.q8ee.com/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Deny dotfiles (.env, .htaccess sources, ...)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog  /srv/www/parttime.q8ee.com/error.log
    CustomLog /srv/www/parttime.q8ee.com/access.log combined
</VirtualHost>
