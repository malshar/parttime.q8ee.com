# Apache vhost for parttime.q8ee.com (نظام المنتدبين)
#
# Install on the Ubuntu/Apache server (same server as help.q8ee.com):
#   sudo cp deploy/apache-vhost.conf /etc/apache2/sites-available/parttime.q8ee.com.conf
#   sudo a2enmod ssl rewrite proxy proxy_fcgi headers
#   sudo a2ensite parttime.q8ee.com
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Adjust the PHP-FPM socket below to the installed PHP version
# (check with: ls /run/php/).
#
# TLS here is a Cloudflare *origin* certificate (Cloudflare SSL mode: Full
# (strict) — see DEPLOY.md). Generate it in the Cloudflare dashboard under
# SSL/TLS → Origin Server, and place the two files at the paths below.

<VirtualHost *:80>
    ServerName parttime.q8ee.com
    RewriteEngine On
    RewriteRule ^ https://parttime.q8ee.com%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName   parttime.q8ee.com
    ServerAdmin  webmaster@q8ee.com
    DocumentRoot /srv/www/parttime.q8ee.com/app/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/cloudflare/parttime.q8ee.com.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/parttime.q8ee.com.key

    <Directory /srv/www/parttime.q8ee.com/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- Hand .php requests to PHP-FPM ---
    # Change php8.3 to match your server (see: ls /run/php/).
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # --- Deny dotfiles, .env and anything outside public/ that leaks in ---
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/parttime.q8ee.com-error.log
    CustomLog ${APACHE_LOG_DIR}/parttime.q8ee.com-access.log combined
</VirtualHost>
</IfModule>
